[uwsgi]
chdir = /var/www/nfc_hunt
home = /var/www/nfc_hunt/venv
module = app
callable = app

master = true
# Single process with threads: Flask-SocketIO long-polling needs session
# affinity, which multi-process uWSGI does not provide. The leaderboard
# falls back to its JS poll either way, but keep this at 1 for native WS.
processes = 1
enable-threads = true

# Dedicated runtime directory over /tmp
socket = /var/run/uwsgi/nfc_hunt.sock
chmod-socket = 660
vacuum = true

uid = nginx
gid = nginx
