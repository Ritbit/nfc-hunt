# Nginx reverse proxy for the NFC Treasure Hunt.
# HTTPS is required: iOS/Android NFC handlers only launch https:// URLs
# silently, and the Web NFC API requires a secure context.
# Add TLS (listen 443 ssl, certificates) via certbot or your provider.

server {
    listen 80;
    server_name _;

    location / {
        include uwsgi_params;
        uwsgi_pass unix:///var/run/uwsgi/nfc_hunt.sock;
    }

    location /static {
        alias /var/www/nfc_hunt/static;
    }
}
